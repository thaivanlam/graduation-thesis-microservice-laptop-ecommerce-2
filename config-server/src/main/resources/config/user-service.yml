spring:
  jpa:
    hibernate:
      ddl-auto: update

  # -------------------------------------------------------------------
  # ADR-0012 — Keycloak as the identity provider
  # -------------------------------------------------------------------
  # This service issues no tokens. It validates them like any other resource
  # server, against the realm's cached JWKS, and holds no signing key — which is
  # what closes SEC-04: the shared HMAC secret that used to sit here let any
  # service that could validate a token also mint one.
  #
  # issuer-uri is the PUBLIC address and is only ever compared against the `iss`
  # claim; jwk-set-uri is the address this container can reach, and is the one
  # actually called. See docs/operations/configuration-reference.md.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/techzone}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/techzone/protocol/openid-connect/certs}

server:
  port: 8082
  tomcat:
    # Tomcat publishes its thread-pool counters through JMX only, and
    # Micrometer's TomcatMetrics binds to that registry. Without this flag
    # tomcat_threads_* is simply absent — an empty "busy threads" panel.
    mbeanregistry:
      enabled: true

springdoc:
  api-docs:
    enabled: true

# ---------------------------------------------------------------------
# OBSERVABILITY — Micrometer -> Prometheus
# ---------------------------------------------------------------------
# `prometheus` is the scrape endpoint the Prometheus container reads every
# 10s; `health` and `info` are what a human and Compose read. Nothing else is
# exposed, and none of it is routed at the gateway, so the endpoints are
# reachable only from inside the Docker network.
#
# The histogram on http.server.requests is what makes latency percentiles
# possible: without it Prometheus only ever sees a count and a sum, and a p95
# cannot be computed after the fact. See docs/operations/observability.md.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,2s

# ---------------------------------------------------------------------
# Keycloak Admin API — used by POST/GET/DELETE /api/admin/users
# ---------------------------------------------------------------------
# base-url is reached server-to-server, so inside Docker it is the container
# name, not the address a browser uses.
#
# admin-client-secret NAMES the variable and never holds a value: it comes from
# the environment as KEYCLOAK_ADMIN_CLIENT_SECRET, the same way STRIPE_SECRET_KEY
# and MAIL_PASSWORD already do. The service account it belongs to holds
# manage-users, view-users and query-users on realm-management and nothing else —
# notably not manage-realm, so nothing reachable from this service can alter the
# realm's roles or clients.
techzone:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8090}
    realm: ${KEYCLOAK_REALM:techzone}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:techzone-admin-api}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
