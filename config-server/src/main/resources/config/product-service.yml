spring:
  jpa:
    hibernate:
      ddl-auto: update

  # -------------------------------------------------------------------
  # ADR-0012 — Keycloak as the identity provider
  # -------------------------------------------------------------------
  # This service is an OIDC resource server. It verifies RS256 access tokens
  # locally against the realm's cached JWKS and holds no signing key of its own,
  # which is what closes SEC-04: the shared HMAC secret that used to sit here
  # let any service that could validate a token also mint one.
  #
  # Two URLs, not one, and the distinction is load-bearing. `iss` in the token is
  # whatever host the browser used to obtain it, so issuer-uri must be the PUBLIC
  # address and is only ever compared, never fetched. jwk-set-uri is the address
  # this container can actually reach, and is the one called. Setting both also
  # skips OIDC discovery, so the service starts even if Keycloak is still coming
  # up. See docs/operations/configuration-reference.md.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/techzone}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/techzone/protocol/openid-connect/certs}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

project:
  image: images/

server:
  port: 8081
  tomcat:
    # Tomcat publishes its thread-pool counters through JMX only, and
    # Micrometer's TomcatMetrics binds to that registry. Without this flag
    # tomcat_threads_* is simply absent — an empty "busy threads" panel.
    mbeanregistry:
      enabled: true

springdoc:
  api-docs:
    enabled: true

# ---------------------------------------------------------------------
# OBSERVABILITY — Micrometer -> Prometheus
# ---------------------------------------------------------------------
# `prometheus` is the scrape endpoint the Prometheus container reads every
# 10s; `health` and `info` are what a human and Compose read. Nothing else is
# exposed, and none of it is routed at the gateway, so the endpoints are
# reachable only from inside the Docker network.
#
# The histogram on http.server.requests is what makes latency percentiles
# possible: without it Prometheus only ever sees a count and a sum, and a p95
# cannot be computed after the fact. See docs/operations/observability.md.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,2s
