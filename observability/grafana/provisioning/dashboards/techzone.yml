apiVersion: 1

providers:
  - name: techzone
    orgId: 1
    folder: TechZone
    type: file
    disableDeletion: false
    # Edits made in the UI are overwritten on the next reload. Change the JSON
    # in the repository instead — that is the point of provisioning them.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
