# Test-only configuration for order-service. See product-service for the rationale.
spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # ADR-0012: the resource-server auto-configuration needs somewhere to fetch keys
  # from. Nothing here is ever contacted - every test either builds a Jwt by hand or
  # uses SecurityMockMvcRequestPostProcessors.jwt(), so the decoder is never asked to
  # decode anything. The host is RFC 2606 reserved so that a test which does start
  # reaching out fails loudly rather than talking to something real.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.invalid/realms/techzone
          jwk-set-uri: https://keycloak.invalid/realms/techzone/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

queue:
  notification:
    exchange: notification-exchange
    routing-key: notification-routing-key

product:
  service:
    base-url: http://product-service-under-test/api

stripe:
  secret:
    key: sk_test_placeholder_never_contacted
