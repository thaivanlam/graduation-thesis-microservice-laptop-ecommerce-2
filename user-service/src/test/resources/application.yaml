# Test-only configuration for user-service. See product-service for the rationale.
spring:
  application:
    name: user-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:user_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # ADR-0012: the resource-server auto-configuration needs somewhere to fetch keys
  # from. Nothing here is ever contacted - every test either builds a Jwt by hand or
  # uses SecurityMockMvcRequestPostProcessors.jwt(). The host is RFC 2606 reserved so
  # that a test which does start reaching out fails loudly rather than talking to
  # something real.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.invalid/realms/techzone
          jwk-set-uri: https://keycloak.invalid/realms/techzone/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

queue:
  notification:
    queue: notification-queue
    exchange: notification-exchange
    routing-key: notification-routing-key

# Same idea for the Admin API client: KeycloakAdminClient is a mock in every test, so
# this base URL is never dialled. The secret is empty on purpose - a test must never
# depend on a real one being present.
techzone:
  keycloak:
    base-url: https://keycloak.invalid
    realm: techzone
    admin-client-id: techzone-admin-api
    admin-client-secret: ""
