# Test-only configuration for user-service. See product-service for the rationale.
spring:
  application:
    name: user-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:user_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  app:
    jwtSecret: dGVjaHpvbmUtdGVzdC1vbmx5LWp3dC1zaWduaW5nLXNlY3JldC1ub3QtdXNlZC1pbi1hbnktcmVhbC1lbnYtMDE=
    jwtExpirationMs: 3600000
  ecom:
    app:
      jwtCookieName: springBootEcom

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

queue:
  notification:
    queue: notification-queue
    exchange: notification-exchange
    routing-key: notification-routing-key
