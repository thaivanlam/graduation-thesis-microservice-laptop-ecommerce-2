# Test-only configuration for product-service.
#
# This file shadows src/main/resources/application.yaml on the test classpath, so
# the test JVM never contacts the Config Server, Eureka or MySQL. Every value here
# is throw-away; no token is signed or verified here (ADR-0012).
spring:
  application:
    name: product-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:product_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  # ADR-0012: the resource-server auto-configuration needs somewhere to fetch keys
  # from. Nothing here is ever contacted - every test either builds a Jwt by hand or
  # uses SecurityMockMvcRequestPostProcessors.jwt(), so the decoder is never asked to
  # decode anything. The host is RFC 2606 reserved so that a test which does start
  # reaching out fails loudly rather than talking to something real.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.invalid/realms/techzone
          jwk-set-uri: https://keycloak.invalid/realms/techzone/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

project:
  image: target/test-images/

image:
  base:
    url: http://localhost:8081/images
