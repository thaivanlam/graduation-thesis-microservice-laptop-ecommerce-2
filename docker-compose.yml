services:

  # =====================
  # INFRASTRUCTURE
  # =====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      # No MYSQL_DATABASE on purpose. It would create `ecommerce` first, with
      # the server default collation, turning the CREATE DATABASE in
      # init-db/01-create-databases.sql into a no-op and leaving the three
      # schemas on inconsistent collations. The init script owns all three.
    ports:
      # Host port only — services reach MySQL as mysql:3306 on the network.
      # Override MYSQL_PORT when a local mysqld already holds 3306.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, when mysql_data is first created and before any service
      # starts: creates the three logical databases. It cannot insert rows —
      # Hibernate has not created the tables at that point (see seed-db/).
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================
  # DEMO DATA SEEDER
  # =====================
  # One-shot container, opt-in through the `seed` profile:
  #   COMPOSE_PROFILES=prod,seed docker compose up
  #
  # It waits for product-service to create its tables, then loads a demo
  # catalogue. Deliberately no `depends_on: product-service` — that service has
  # no healthcheck, an open port would not prove the tables exist, and a
  # cross-profile dependency breaks when `seed` runs without `prod`. The script
  # polls information_schema for the real signal instead.
  db-seed:
    image: mysql:8.0
    container_name: db-seed
    profiles: ["seed"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - ./seed-db:/seed:ro
    entrypoint: ["bash", "/seed/run-seed.sh"]
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # =====================
  # CONFIG SERVER
  # =====================
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - ecommerce-network
    # The runtime image ships neither curl nor wget, so probe the port with
    # bash's /dev/tcp. Spring binds it only once startup has finished.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8888' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================
  # DISCOVERY SERVICE (Eureka)
  # =====================
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================
  # BUSINESS SERVICES
  # =====================
  user-service:
    build: ./user-service
    container_name: user-service
    profiles: ["prod"]
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    profiles: ["prod"]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080/product-manager/images}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    profiles: ["prod"]
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    profiles: ["prod"]
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks:
      - ecommerce-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  # =====================
  # API GATEWAY
  # =====================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    profiles: ["prod"]
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      EUREKA_SERVER_URL: http://discovery-service:8761
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - ecommerce-network
    depends_on:
      discovery-service:
        condition: service_healthy
    # No actuator on the gateway, so probe the listening port instead.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  ecommerce-network:
    driver: bridge
