services:

  # =====================
  # INFRASTRUCTURE
  # =====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      # No MYSQL_DATABASE on purpose. It would create `ecommerce` first, with
      # the server default collation, turning the CREATE DATABASE in
      # init-db/01-create-databases.sql into a no-op and leaving the three
      # schemas on inconsistent collations. The init script owns all three.
    ports:
      # Host port only — services reach MySQL as mysql:3306 on the network.
      # Override MYSQL_PORT when a local mysqld already holds 3306.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, when mysql_data is first created and before any service
      # starts: creates the three logical databases. It cannot insert rows —
      # Hibernate has not created the tables at that point (see seed-db/).
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================
  # IDENTITY PROVIDER (ADR-0012)
  # =====================
  # Deliberately NOT behind a compose profile. Since ADR-0012 the platform
  # issues no tokens of its own, so nobody can sign in to any mode — including
  # the hybrid Mode 3, where the services run from an IDE — unless Keycloak is
  # up. It belongs with mysql and rabbitmq, not with the business services.
  #
  # `start-dev` is correct for this project and wrong for a published one: it
  # disables HTTPS enforcement and strict hostname checks. Risk 6 in
  # docs/architecture/keycloak-migration-plan.md — the admin console must not
  # be published on a host port outside a development laptop.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap console account. Names the variables, never the values —
      # the defaults below are development-only, as with Grafana above.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Its own logical database in the existing instance, per ADR-0008.
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?createDatabaseIfNotExist=true&characterEncoding=UTF-8
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      KC_HTTP_PORT: 8090
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # Pins the `iss` claim to the address the BROWSER used, whichever host name
      # a given request arrived on. Without it the issuer follows the request, so
      # a token fetched by the SPA via localhost and a JWKS fetched by a service
      # via the container name disagree, and every service answers 401. The
      # services are configured with this same value as issuer-uri; they fetch
      # keys from KEYCLOAK_JWK_SET_URI instead, which is the reachable one.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      # …while letting server-to-server callers keep using http://keycloak:8090.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Substituted into realm-techzone.json at import time. The realm file
      # carries the variable name and a development default, never a real
      # secret — same pattern as STRIPE_SECRET_KEY and MAIL_PASSWORD.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-techzone-admin-api-dev-secret}
      KEYCLOAK_TESTS_CLIENT_SECRET: ${KEYCLOAK_TESTS_CLIENT_SECRET:-techzone-tests-dev-secret}
    ports:
      - "${KEYCLOAK_PORT:-8090}:8090"
    volumes:
      # --import-realm reads every file in this directory on start. The import
      # is skipped for a realm that already exists, so editing this file has no
      # effect on a stack whose keycloak database is already populated — see
      # docs/operations/running-locally.md.
      - ./keycloak/realm-techzone.json:/opt/keycloak/data/import/realm-techzone.json:ro
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
    # The image ships neither curl nor wget. Talk to the management port with
    # bash's /dev/tcp instead: /health/ready reports UP only once the realm
    # import has finished, which an open TCP port would not prove.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # =====================
  # DEMO DATA SEEDER
  # =====================
  # One-shot container, opt-in through the `seed` profile:
  #   COMPOSE_PROFILES=prod,seed docker compose up
  #
  # It waits for product-service to create its tables, then loads a demo
  # catalogue. Deliberately no `depends_on: product-service` — that service has
  # no healthcheck, an open port would not prove the tables exist, and a
  # cross-profile dependency breaks when `seed` runs without `prod`. The script
  # polls information_schema for the real signal instead.
  db-seed:
    image: mysql:8.0
    container_name: db-seed
    profiles: ["seed"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - ./seed-db:/seed:ro
    entrypoint: ["bash", "/seed/run-seed.sh"]
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # =====================
  # CONFIG SERVER
  # =====================
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - ecommerce-network
    # The runtime image ships neither curl nor wget, so probe the port with
    # bash's /dev/tcp. Spring binds it only once startup has finished.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8888' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================
  # DISCOVERY SERVICE (Eureka)
  # =====================
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================
  # BUSINESS SERVICES
  # =====================
  user-service:
    build: ./user-service
    container_name: user-service
    profiles: ["prod"]
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/techzone}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8090/realms/techzone/protocol/openid-connect/certs}
      # user-service alone also calls the Admin API, server to server, to create
      # and delete accounts. KEYCLOAK_BASE_URL is therefore the reachable
      # address, and the secret comes from the environment - never committed.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8090}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-techzone}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-techzone-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-techzone-admin-api-dev-secret}
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    profiles: ["prod"]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8080/product-manager/images}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/techzone}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8090/realms/techzone/protocol/openid-connect/certs}
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    profiles: ["prod"]
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/techzone}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8090/realms/techzone/protocol/openid-connect/certs}
    networks:
      - ecommerce-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    profiles: ["prod"]
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_URL: http://config-server:8888
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks:
      - ecommerce-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  # =====================
  # API GATEWAY
  # =====================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    profiles: ["prod"]
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      EUREKA_SERVER_URL: http://discovery-service:8761
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8090/realms/techzone}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8090/realms/techzone/protocol/openid-connect/certs}
    networks:
      - ecommerce-network
    depends_on:
      discovery-service:
        condition: service_healthy
      # spring.security.oauth2.resourceserver.jwt.issuer-uri performs OIDC
      # discovery during startup, so the realm has to answer before the
      # resource-server filter chain can be built (ADR-0012).
      keycloak:
        condition: service_healthy
    # The runtime image ships neither curl nor wget, so probe the listening
    # port rather than /actuator/health.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # =====================
  # OBSERVABILITY
  # =====================
  # Opt-in through the `observability` profile, so the everyday stack stays as
  # small as it was:
  #   COMPOSE_PROFILES=prod,observability docker compose up -d
  #
  # Deliberately no `depends_on` on the business services: they live in the
  # `prod` profile, and a cross-profile dependency breaks when `observability`
  # is started on its own (the same trap documented on db-seed above).
  # Prometheus retries a target it cannot reach, so a service that starts two
  # minutes later simply appears in the graphs two minutes later.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # A fortnight is far more than a laptop run needs and costs little; the
      # point is that a load run from last week is still comparable.
      - "--storage.tsdb.retention.time=15d"
      # Allows `curl -X POST localhost:9090/-/reload` after editing
      # prometheus.yml, instead of restarting the container.
      - "--web.enable-lifecycle"
    networks:
      - ecommerce-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    profiles: ["observability"]
    ports:
      # 3000 inside the container, published on 3001 by default: port 3000 is
      # one of the frontend dev origins the gateway allows for CORS, so it is
      # left free for a Vite server.
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only viewing without a login: the dashboards carry no secrets and
      # this is a local stack. Editing still needs the admin account, and
      # provisioned dashboards are read-only in the UI regardless.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  ecommerce-network:
    driver: bridge
