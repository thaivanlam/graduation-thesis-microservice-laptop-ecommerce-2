spring:
  application:
    name: api-gateway

  # -------------------------------------------------------------------
  # ADR-0012 — Keycloak as the identity provider
  # -------------------------------------------------------------------
  # Access tokens are RS256 and are verified locally against the realm's cached
  # JWKS. The gateway holds no signing key, so it cannot mint a token; Keycloak
  # is a dependency of signing in, not of an already authenticated request.
  #
  # Two URLs, not one, and the distinction is load-bearing. `iss` in the token
  # is whatever host the browser used to obtain it, so issuer-uri must be the
  # PUBLIC address and is only ever compared, never fetched. jwk-set-uri is the
  # address this container can actually reach, and is the one called. Setting
  # both also skips OIDC discovery, so the gateway starts even if Keycloak is
  # still coming up.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/techzone}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/techzone/protocol/openid-connect/certs}


  cloud:
    gateway:
      routes:
        - id: product-manager
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product-manager/**
          filters:
            - RewritePath=/product-manager/(?<segment>.*), /$\{segment}
        - id: user-manager
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-manager/**
          filters:
            - RewritePath=/user-manager/(?<segment>.*), /$\{segment}
        - id: order-manager
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-manager/**
          filters:
            - RewritePath=/order-manager/(?<segment>.*), /$\{segment}
        - id: eureka-server
          uri: ${EUREKA_SERVER_URL:http://localhost:8761}
          predicates:
            - Path=/eureka/main
          filters:
            - SetPath=/
        - id: eureka-server-static
          uri: ${EUREKA_SERVER_URL:http://localhost:8761}
          predicates:
            - Path=/eureka/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "${FRONTEND_URL:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

gateway:
  security:
    public-paths:
      - /user-manager/api/auth/**
      - /user-manager/api/public/**
      - /product-manager/api/public/**
      - /product-manager/images/**
      - /order-manager/api/public/**
      - /order-manager/api/internal/**
      - /eureka/**
      - /v3/api-docs/**
      - /user-manager/v3/api-docs/**
      - /product-manager/v3/api-docs/**
      - /order-manager/v3/api-docs/**
      - /swagger-ui/**
    role-mappings:
      - pattern: /product-manager/api/admin/**
        roles: [ROLE_ADMIN]
      - pattern: /product-manager/api/seller/**
        roles: [ROLE_SELLER]
      - pattern: /user-manager/api/admin/**
        roles: [ROLE_ADMIN]
      - pattern: /order-manager/api/admin/**
        roles: [ROLE_ADMIN]
      - pattern: /order-manager/api/seller/**
        roles: [ROLE_ADMIN, ROLE_SELLER]

server:
  port: 8080

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: USER-SERVICE
        url: /user-manager/v3/api-docs
      - name: PRODUCT-SERVICE
        url: /product-manager/v3/api-docs
      - name: ORDER-SERVICE
        url: /order-manager/v3/api-docs

# ---------------------------------------------------------------------
# OBSERVABILITY — Micrometer -> Prometheus
# ---------------------------------------------------------------------
# The gateway is the only place a request is seen once, whichever service
# answers it, so its metrics are the platform-level view of latency,
# throughput and errors. Two families matter:
#   http.server.requests           — the Netty server side, per URI
#   spring.cloud.gateway.requests  — per route id, enabled automatically once
#                                    actuator is on the classpath
# Both get an explicit histogram; percentiles cannot be recovered from a
# count and a sum after the fact. See docs/operations/observability.md.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,2s
        spring.cloud.gateway.requests: 100ms,200ms,500ms,1s,2s
